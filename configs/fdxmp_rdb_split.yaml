feeder: dataset.dataloader_video.BaseFeeder
phase: train
dataset: phoenix14
split_manifest: ./preprocess/phoenix2014/split_manifest.json
num_epoch: 40
work_dir: ./work_dir/fd_xmp_v3/E10_fdxmp_rdb_seed0/
batch_size: 2
random_seed: 0
test_batch_size: 8
num_worker: 10
device: 0
log_interval: 50
eval_interval: 1
save_interval: 5
evaluate_tool: sclite

loss_weights:
  SeqCTC: 1.0
  ConvCTC: 1.0
  ProtoAlign: 0.01
  SignerCE: 0.01
  SignerAdv: 0.01
  SignerReg: 0.0001
  SignerInv: 0.05
  SignerOrth: 0.0001
  RDBRecon: 0.05
  RDBCTC: 0.05
  RDBStyle: 0.02

optimizer_args:
  optimizer: Adam
  base_lr: 0.0001
  step: [20, 35]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: False
  grad_clip_norm: 5.0

feeder_args:
  mode: train
  datatype: video
  num_gloss: -1
  drop_ratio: 1.0

model: fd_xmp_network.FDXMPModel
decode_mode: beam
model_args:
  num_classes: 1296
  c2d_type: resnet18
  conv_type: 2
  use_bn: 1
  share_classifier: True
  weight_norm: True
  proto_enabled: True
  proto_momentum: 0.9
  proto_confidence: 0.1
  proto_temperature: 0.1
  proto_gate_init: 0.05
  proto_align_weight: 0.01
  proto_align_warmup_epochs: 5
  proto_mode: cosine
  proto_variance_shrinkage: 0.1
  proto_variance_floor: 0.0001
  class_prior_path: ./preprocess/phoenix2014/train_prior_split0.npy
  prior_tau: 0.0
  fdgc_enabled: True
  fdgc_tau_max: 2.0
  fdgc_delta_max: 0.5
  fdgc_blank_bias_max: 1.0
  signer_film: True
  max_signer_id: 31
  signer_rank: 4
  signer_adversarial_strength: 0.1
  signer_inv_temperature: 0.1
  signer_inv_queue_size: 2048
  signer_inv_confidence: 0.1
  signer_inv_min_mass: 0.05
  rdb_enabled: True
  rdb_max_strength: 0.20
  rdb_hidden_size: 64
  rdb_kernel_size: 3
  rdb_min_content_mass: 0.05
  rdb_min_prototype_support: 0.05
  rdb_confidence_threshold: 0.1
  rdb_recon_warmup_epochs: 5
  rdb_recon_mse_weight: 1.0
  rdb_recon_cosine_weight: 0.1
  rdb_recon_temperature: 0.1
  rdb_style_separation_margin: 0.0001
  rdb_style_separation_weight: 1.0
