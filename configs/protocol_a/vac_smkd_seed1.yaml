feeder: dataset.dataloader_video.BaseFeeder
phase: train
dataset: phoenix14
split_manifest: ./preprocess/phoenix2014/split_manifest.json
num_epoch: 40
work_dir: ./work_dir/fd_xmp_v3/A_protocol/vac_smkd/seed1/
batch_size: 2
random_seed: 1
test_batch_size: 8
num_worker: 10
device: 0
log_interval: 50
eval_interval: 1
save_interval: 5
evaluate_tool: sclite
loss_weights:
  SeqCTC: 1.0
  ConvCTC: 1.0
optimizer_args:
  optimizer: Adam
  base_lr: 0.0001
  step:
  - 20
  - 35
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: false
  grad_accum_steps: 1
  grad_clip_norm: 5.0
feeder_args:
  mode: train
  datatype: video
  num_gloss: -1
  drop_ratio: 1.0
model: slr_network.SLRModel
decode_mode: beam
model_args:
  num_classes: 1296
  c2d_type: resnet18
  conv_type: 2
  use_bn: 1
  share_classifier: true
  weight_norm: true
checkpoint_split: cal
